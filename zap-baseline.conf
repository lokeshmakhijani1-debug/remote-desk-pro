# ZAP baseline rule configuration
# Keep all security-relevant rules at WARN by default.
# These three rules are informational observations, not exploitable weaknesses:
# 10015 reviews the explicit no-store/no-cache policy.
# 10049 reports non-storable responses (the intended result for remote-access content).
# 10109 recommends client-side crawling for a modern SPA.
10015	INFO	(Cache-control policy is explicit: no-store, max-age=0 and Pragma no-cache)
10049	INFO	(Non-storable responses are intentional for remote-access content)
10109	INFO	(Modern Web Application - client-side crawling may be needed)
