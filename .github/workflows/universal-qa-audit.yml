name: Universal QA and Security Audit

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional deployed HTTP(S) URL for browser and ZAP checks
        required: false
        type: string
      fail_on_findings:
        description: Fail when a configured scanner fails
        required: false
        default: false
        type: boolean
  push:
    branches: ["**"]

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: universal-qa-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QA_BASE_URL: ${{ inputs.base_url || vars.QA_BASE_URL || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize reports and detect stack
        run: |
          mkdir -p reports/universal-qa
          python - <<'PY'
          import json, pathlib
          r=pathlib.Path(".")
          d={"python":any(r.glob("**/requirements*.txt")) or any(r.glob("**/pyproject.toml")),
             "node":any(p.name=="package.json" and "node_modules" not in p.parts for p in r.rglob("package.json")),
             "docker":(r/"Dockerfile").exists() or any(r.glob("**/Dockerfile"))}
          pathlib.Path("reports/universal-qa/detected-stack.json").write_text(json.dumps(d,indent=2))
          PY
      - name: Gitleaks full-history secret scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Install Semgrep
        id: semgrep_install
        run: python -m pip install --disable-pip-version-check semgrep
        continue-on-error: true
      - name: Semgrep SAST
        id: semgrep
        if: steps.semgrep_install.outcome == 'success'
        run: semgrep scan --config auto --error --json --output reports/universal-qa/semgrep.json .
        continue-on-error: true
      - name: Python dependency audit
        id: pip_audit
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(**/requirements*.txt)
          if (( ${#files[@]} == 0 )); then echo '{"status":"skipped","reason":"No Python manifests"}' > reports/universal-qa/pip-audit.json; exit 0; fi
          python -m pip install --disable-pip-version-check pip-audit
          for file in "${files[@]}"; do
            safe=$(echo "$file" | tr '/.' '__')
            pip-audit -r "$file" --format json > "reports/universal-qa/pip-audit-$safe.json"
          done
        continue-on-error: true
      - name: Node dependency audit
        id: npm_audit
        shell: bash
        run: |
          mapfile -t manifests < <(find . -type f -name package.json -not -path '*/node_modules/*' -not -path '*/.git/*' | sort)
          if (( ${#manifests[@]} == 0 )); then echo '{"status":"skipped","reason":"No package.json manifests"}' > reports/universal-qa/npm-audit.json; exit 0; fi
          failed=0
          for manifest in "${manifests[@]}"; do
            dir=$(dirname "$manifest")
            [[ -f "$dir/package-lock.json" || -f "$dir/npm-shrinkwrap.json" ]] || { echo "Skip $dir: no lockfile"; continue; }
            name=$(echo "$dir" | sed 's#^\./##; s#[/]#_#g')
            (cd "$dir" && npm audit --json) > "reports/universal-qa/npm-audit-${name:-root}.json" || failed=1
          done
          exit "$failed"
        continue-on-error: true
      - name: Install Playwright
        id: playwright_install
        if: env.QA_BASE_URL != ''
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
        continue-on-error: true
      - name: Generic Playwright browser smoke and same-origin crawl
        id: playwright
        if: env.QA_BASE_URL != '' && steps.playwright_install.outcome == 'success'
        run: |
          python - <<'PY'
          import asyncio,json,os
          from urllib.parse import urlparse
          from playwright.async_api import async_playwright
          async def main():
            base=os.environ["QA_BASE_URL"].strip(); parsed=urlparse(base)
            if parsed.scheme not in ("http","https") or not parsed.netloc: raise SystemExit("QA_BASE_URL must be HTTP(S)")
            seen=set(); queue=[base]; pages=[]; errors=[]
            async with async_playwright() as p:
              browser=await p.chromium.launch(); page=await browser.new_page()
              page.on("pageerror",lambda e: errors.append(str(e)[:400]))
              while queue and len(seen)<20:
                url=queue.pop(0)
                if url in seen: continue
                seen.add(url)
                try:
                  response=await page.goto(url,wait_until="domcontentloaded",timeout=30000)
                  status=response.status if response else None
                  pages.append({"url":url,"status":status,"title":await page.title()})
                  if status is None or status>=400: errors.append(f"HTTP {status}: {url}")
                  links=await page.locator("a[href]").evaluate_all("(a)=>a.map(x=>x.href)")
                  for link in links:
                    if urlparse(link).netloc==parsed.netloc and link not in seen and link not in queue: queue.append(link.split("#",1)[0])
                except Exception as e: errors.append(f"{url}: {str(e)[:400]}")
              await browser.close()
            report={"target":base,"pages_checked":len(pages),"pages":pages,"errors":errors}
            open("reports/universal-qa/playwright-smoke.json","w").write(json.dumps(report,indent=2))
            if not pages or errors: raise SystemExit(1)
          asyncio.run(main())
          PY
        continue-on-error: true
      - name: OWASP ZAP baseline
        id: zap
        if: env.QA_BASE_URL != ''
        run: |
          docker run --rm --network host -v "$PWD/reports/universal-qa:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t "$QA_BASE_URL" -J zap-baseline.json -r zap-baseline.html
        continue-on-error: true
      - name: Lighthouse performance, accessibility and SEO audit
        id: lighthouse
        if: env.QA_BASE_URL != ''
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund lighthouse
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "$CHROME_BIN" ]]; then
            echo "No Chromium-compatible browser found on runner."
            exit 1
          fi
          export CHROME_PATH="$CHROME_BIN"
          npx --no-install lighthouse "$QA_BASE_URL" \
            --output=json --output=html \
            --output-path=reports/universal-qa/lighthouse \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
        continue-on-error: true

      - name: Rendered DOM, CSS and UI/UX inspection
        id: uiux
        if: env.QA_BASE_URL != '' && steps.playwright_install.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import asyncio, json, os
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page(viewport={"width": 1365, "height": 900})
                  await page.goto(os.environ["QA_BASE_URL"], wait_until="networkidle", timeout=45000)
                  dom = await page.evaluate("""() => {
                    const visible = el => !!(el.getClientRects().length) && getComputedStyle(el).visibility !== 'hidden';
                    const all = s => [...document.querySelectorAll(s)].filter(visible);
                    const contrast = (fg,bg) => {
                      const rgb = c => (c.match(/[\\d.]+/g)||[]).slice(0,3).map(Number);
                      const lum = c => rgb(c).map(v => {v/=255; return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0);
                      const a=lum(fg), b=lum(bg); return (Math.max(a,b)+.05)/(Math.min(a,b)+.05);
                    };
                    const textNodes = all('body *').filter(e => e.children.length===0 && (e.innerText||'').trim());
                    let lowContrast=0, sampled=0;
                    for (const e of textNodes.slice(0,150)) {
                      const cs=getComputedStyle(e), bg=cs.backgroundColor;
                      if (cs.color.startsWith('rgb') && bg.startsWith('rgb') && !bg.includes('0, 0, 0, 0')) {
                        sampled++; if (contrast(cs.color,bg)<4.5) lowContrast++;
                      }
                    }
                    const imgs=all('img'), buttons=all('button,[role=button],input[type=submit]');
                    const links=all('a[href]'), headings=all('h1,h2,h3,h4,h5,h6');
                    const css=[...document.styleSheets].map(s=>({href:s.href||'inline',disabled:s.disabled}));
                    const metrics={
                      title:document.title, viewportMeta:!!document.querySelector('meta[name=viewport]'),
                      h1Count:all('h1').length, headingCount:headings.length,
                      landmarkCount:all('main,nav,header,footer,[role=main],[role=navigation]').length,
                      images:imgs.length, imagesMissingAlt:imgs.filter(i=>!i.hasAttribute('alt')).length,
                      buttons:buttons.length, buttonsUnlabelled:buttons.filter(b=>!(b.innerText||b.getAttribute('aria-label')||b.getAttribute('title')||b.value||'').trim()).length,
                      links:links.length, linksWithoutName:links.filter(a=>!(a.innerText||a.getAttribute('aria-label')||'').trim()).length,
                      forms:all('input,select,textarea').length,
                      fieldsWithoutLabel:all('input:not([type=hidden]),select,textarea').filter(e=>!e.labels?.length && !e.getAttribute('aria-label') && !e.getAttribute('aria-labelledby')).length,
                      lowContrastSamples:lowContrast, contrastSamples:sampled,
                      horizontalOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth,
                      documentWidth:document.documentElement.scrollWidth, viewportWidth:document.documentElement.clientWidth,
                      cssStylesheets:css.length, inlineStyleElements:document.querySelectorAll('style').length,
                      fontFamilies:[...new Set(textNodes.slice(0,100).map(e=>getComputedStyle(e).fontFamily))].slice(0,12),
                      bodyFontSize:getComputedStyle(document.body).fontSize
                    };
                    return metrics;
                  }""")
                  await page.screenshot(path="reports/universal-qa/uiux-homepage.png", full_page=True)
                  await browser.close()
              # Transparent heuristic score; it is a triage signal, not a WCAG certification.
              score=100
              penalties={
                "missing_viewport": 10 if not dom["viewportMeta"] else 0,
                "missing_h1": 8 if dom["h1Count"]==0 else 0,
                "missing_landmarks": 8 if dom["landmarkCount"]==0 else 0,
                "unlabelled_images": min(12,dom["imagesMissingAlt"]*2),
                "unlabelled_buttons": min(12,dom["buttonsUnlabelled"]*3),
                "unlabelled_links": min(10,dom["linksWithoutName"]*2),
                "unlabelled_fields": min(12,dom["fieldsWithoutLabel"]*3),
                "contrast_samples": min(15,round(15*dom["lowContrastSamples"]/max(1,dom["contrastSamples"]))),
                "horizontal_overflow": 8 if dom["horizontalOverflow"] else 0
              }
              score=max(0,score-sum(penalties.values()))
              directions=[
                {"name":"Accessible clarity","direction":"Strengthen semantic hierarchy, visible focus, form labels, contrast and readable type scale.","when":"Prioritize if accessibility and comprehension issues dominate the findings."},
                {"name":"Responsive minimalism","direction":"Use a consistent spacing scale, restrained surfaces, fluid containers and clear mobile breakpoints.","when":"Prioritize if overflow, dense layouts or inconsistent spacing dominate."},
                {"name":"Action-focused product UI","direction":"Make primary actions visually distinct, group related controls, clarify empty/loading/error states and reduce competing emphasis.","when":"Prioritize if navigation and action discoverability dominate."}
              ]
              result={"target":os.environ["QA_BASE_URL"],"heuristic_score":score,"score_label":"heuristic UI/UX triage score out of 100; not an accessibility certification","metrics":dom,"penalties":penalties,"styling_directions":directions}
              with open("reports/universal-qa/uiux-audit.json","w") as f: json.dump(result,f,indent=2)
              with open("reports/universal-qa/uiux-audit.md","w") as f:
                  f.write("# DOM/CSS and UI/UX audit\\n\\n")
                  f.write(f"**Heuristic score: {score}/100** — not a WCAG certification.\\n\\n")
                  f.write("## Rendered metrics\\n\\n")
                  f.write("| Metric | Observation |\\n|---|---:|\\n")
                  for k,v in dom.items(): f.write(f"| {k} | {v} |\\n")
                  f.write("\\n## Three styling directions\\n")
                  for d in directions: f.write(f"\\n### {d['name']}\\n{d['direction']}\\n\\n{d['when']}\\n")
          asyncio.run(main())
          PY
        continue-on-error: true

      - name: Consolidate JSON and Markdown reports
        if: always()
        env:
          GITLEAKS: ${{ steps.gitleaks.outcome || 'skipped' }}
          SEMGREP: ${{ steps.semgrep.outcome || 'skipped' }}
          PIP_AUDIT: ${{ steps.pip_audit.outcome || 'skipped' }}
          NPM_AUDIT: ${{ steps.npm_audit.outcome || 'skipped' }}
          PLAYWRIGHT: ${{ steps.playwright.outcome || 'skipped' }}
          ZAP: ${{ steps.zap.outcome || 'skipped' }}
          LIGHTHOUSE: ${{ steps.lighthouse.outcome || 'skipped' }}
          UIUX: ${{ steps.uiux.outcome || 'skipped' }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path("reports/universal-qa")
          keys=["GITLEAKS","SEMGREP","PIP_AUDIT","NPM_AUDIT","PLAYWRIGHT","ZAP","LIGHTHOUSE","UIUX"]
          status={k:os.getenv(k,"skipped") for k in keys}
          stack=json.loads((p/"detected-stack.json").read_text()) if (p/"detected-stack.json").exists() else {}
          report={"schema_version":1,"repository":os.getenv("REPOSITORY"),"ref":os.getenv("REF_NAME"),
            "commit":os.getenv("COMMIT_SHA"),"run_id":os.getenv("RUN_ID"),
            "target_url":os.getenv("QA_BASE_URL") or None,"detected_stack":stack,
            "scanner_step_outcomes":status,"evidence_files":sorted(x.name for x in p.iterdir()),
            "limitations":["Browser and ZAP checks require QA_BASE_URL or workflow_dispatch base_url.",
              "npm audit requires lockfiles; Python audit requires dependency manifests.",
              "Baseline scans do not replace an authorized penetration test.", "UI/UX score is a transparent heuristic, not a WCAG conformance claim."]}
          (p/"audit-report.json").write_text(json.dumps(report,indent=2))
          lines=["# Universal QA and Security Audit","","Repository: "+str(report["repository"]),
            "Ref: "+str(report["ref"]),"Commit: "+str(report["commit"]),
            "Target: "+str(report["target_url"] or "Not configured; live checks skipped"),
            "","## Scanner outcomes","","| Scanner | Result |","|---|---|"]
          lines += [f"| {k} | {v} |" for k,v in status.items()]
          lines += ["","## Lighthouse and UI/UX","", "Lighthouse JSON/HTML and DOM/CSS UI/UX reports are included when a target URL is configured.","","## Detected stack","","\x60\x60\x60json",json.dumps(stack,indent=2),"\x60\x60\x60",
            "","## Limitations"]+["- "+x for x in report["limitations"]]
          (p/"audit-report.md").write_text("\n".join(lines)+"\n")
          PY
      - name: Publish workflow summary
        if: always()
        run: cat reports/universal-qa/audit-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload complete audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-qa-audit-reports
          path: reports/universal-qa/
          if-no-files-found: error
          retention-days: 30
      - name: Optional strict scanner gate
        if: always() && inputs.fail_on_findings == true
        run: |
          for result in "${{ steps.gitleaks.outcome }}" "${{ steps.semgrep.outcome }}" "${{ steps.pip_audit.outcome }}" "${{ steps.npm_audit.outcome }}" "${{ steps.playwright.outcome }}" "${{ steps.zap.outcome }}" "${{ steps.lighthouse.outcome }}" "${{ steps.uiux.outcome }}"; do
            [[ "$result" != "failure" ]] || { echo "A configured scanner failed"; exit 1; }
          done
