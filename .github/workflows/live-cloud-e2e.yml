name: Live Cloud E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'RDP_BASE_URL for the private live environment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: live-cloud-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-cloud-e2e:
    name: Render headless host/viewer protocol E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/v2-bidirectional-automation
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt zstandard certifi playwright
          python -m playwright install --with-deps chromium
      - name: Wake Render deployment
        env:
          RDP_BASE_URL: ${{ inputs.base_url }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = os.environ["RDP_BASE_URL"].rstrip("/") + "/health"
          deadline = time.monotonic() + 240
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      body = json.loads(response.read().decode())
                  print(json.dumps(body, indent=2))
                  if body.get("status") == "ok":
                      break
              except Exception as exc:
                  print(f"Render wake retry: {type(exc).__name__}: {exc}")
              time.sleep(10)
          else:
              raise SystemExit("Render /health did not become ready")
          PY
      - name: Run live cloud E2E
        env:
          RDP_BASE_URL: ${{ inputs.base_url }}
          PYTHONUNBUFFERED: "1"
        run: python tests/e2e_cloud_headless.py
      - name: Upload exact JSON report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-cloud-e2e-report
          path: tests/artifacts/cloud_e2e_report.json
          if-no-files-found: warn
          retention-days: 30
