name: Live Cloud E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-cloud-e2e.yml'
      - 'tests/e2e_cloud_headless.py'
      - 'agent/host_agent.py'
      - 'agent/resumable_transfer.py'
      - 'backend/main.py'
      - 'backend/file_transfer.py'

permissions:
  contents: read

concurrency:
  group: live-cloud-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-cloud-e2e:
    name: Render headless host/viewer protocol E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt zstandard certifi playwright
          python -m playwright install --with-deps chromium
      - name: Wake Render deployment
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url = "https://remote-desk-pro-pj29.onrender.com/health"
          deadline = time.monotonic() + 240
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      body = json.loads(response.read().decode())
                  print(json.dumps(body, indent=2))
                  if body.get("status") == "ok":
                      break
              except Exception as exc:
                  print(f"Render wake retry: {type(exc).__name__}: {exc}")
              time.sleep(10)
          else:
              raise SystemExit("Render /health did not become ready")
          PY
      - name: Run live cloud E2E
        env:
          RDP_BASE_URL: https://remote-desk-pro-pj29.onrender.com
          PYTHONUNBUFFERED: "1"
        run: python tests/e2e_cloud_headless.py
      - name: Upload exact JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-cloud-e2e-report
          path: tests/artifacts/cloud_e2e_report.json
          if-no-files-found: warn
          retention-days: 30
