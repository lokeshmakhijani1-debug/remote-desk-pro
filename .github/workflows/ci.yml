name: Remote Desk Pro CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile tests/e2e_remote_control_live.py
      - run: python -m pytest -q
  network-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Exercise real loopback WebSocket transport, jitter and disconnect cleanup
        run: python scripts/verify_websocket_stress.py --clients 12 --rounds 2
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security scanners
        run: python -m pip install --upgrade pip-audit bandit
      - name: Audit backend and Windows agent dependencies
        run: pip-audit -r requirements.txt -r agent/requirements.txt
      - name: Run Bandit high-severity static analysis
        run: bandit -q -r backend agent -lll
      - name: Scan full Git history for secrets
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify mobile portrait, landscape and desktop layouts
        run: npm run test:layout
        working-directory: frontend
