name: V2 Security, Tests and Windows Build
on:
  push:
    branches: [feature/v2-bidirectional-automation]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish a public V2 prerelease after all CI and Windows build jobs pass
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workflow-pipeline:
    name: Session recording workflow E2E and stress
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            agent/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install workflow pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r agent/requirements.txt
          npm --prefix frontend install --no-audit --no-fund
      - name: Run recording conversion, owner API, relay and UI tests
        run: python -m pytest -q tests/test_session_workflow_conversion.py tests/test_saved_workflows.py tests/test_workflow_transport_security.py tests/test_workflow_ui_contract.py
      - name: Build frontend bundle
        run: npm --prefix frontend run build
      - name: Run WebSocket concurrency and disconnect stress
        run: python scripts/verify_websocket_stress.py --clients 12 --rounds 2
      - name: Run fault-injection and load regression
        run: python -m pytest -q tests/test_load_and_fault_injection.py tests/test_v2_fault_injection.py

  tests:
    name: Python regression and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            agent/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r agent/requirements.txt
      - name: Install frontend dependencies
        run: npm --prefix frontend install --no-audit --no-fund
      - name: Compile Python sources
        run: python -m compileall -q agent backend tests
      - name: Run regression and unit tests
        run: python -m pytest -q tests/test_*.py
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Install Chromium for responsive layout E2E
        run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Verify portrait, landscape and desktop responsive viewer layout
        run: npm --prefix frontend run test:layout
      - name: Run live cloud E2E when a target is configured
        env:
          RDP_BASE_URL: ${{ secrets.RDP_BASE_URL }}
        if: ${{ env.RDP_BASE_URL != '' }}
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/e2e_cloud_headless.py

  security:
    name: Full Git history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Gitleaks full-history scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-exe:
    name: Windows V2 executable
    needs: [workflow-pipeline, security]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install packager dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agent/requirements.txt pyinstaller
      - name: Build unified host/viewer executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name RemoteDeskPro-Agent --collect-all mss --collect-all pyautogui --collect-all pyperclip --collect-all pywinauto --collect-all pytesseract --collect-all imageio_ffmpeg --collect-data certifi --collect-all webview --hidden-import workflow_engine --hidden-import adaptive_replay --hidden-import telemetry --hidden-import win32gui --hidden-import win32process --hidden-import psutil --hidden-import websockets.asyncio.client --hidden-import websockets.asyncio.connection agent/host_agent.py
      - name: Verify and checksum executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/RemoteDeskPro-Agent.exe")) { throw "V2 executable missing" }
          $hash = (Get-FileHash "dist/RemoteDeskPro-Agent.exe" -Algorithm SHA256).Hash
          "$hash  RemoteDeskPro-Agent.exe" | Out-File -Encoding ascii "dist/RemoteDeskPro-Agent.exe.sha256"
          Write-Host "RemoteDeskPro-Agent.exe SHA256=$hash"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RemoteDeskPro-Agent-Windows
          path: |
            dist/RemoteDeskPro-Agent.exe
            dist/RemoteDeskPro-Agent.exe.sha256
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    name: Publish optional public V2 prerelease
    needs: [tests, security, windows-exe]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_prerelease == true && github.ref == 'refs/heads/feature/v2-bidirectional-automation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: RemoteDeskPro-Agent-Windows
          path: release
      - name: Publish downloadable prerelease asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v2.0.0-rc.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Remote Desk Pro V2 RC ${{ github.run_number }}
          prerelease: true
          draft: false
          generate_release_notes: true
          files: |
            release/RemoteDeskPro-Agent.exe
            release/RemoteDeskPro-Agent.exe.sha256
